[env:esp8266_tag]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_extra_dirs = ../../libs
lib_deps = https://github.com/vortex314/arduino-dw1000.git#all-fixes
monitor_speed = 115200
upload_speed = 921600
build_unflags = -Werror=return-type
build_flags =
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -DOTA_PASS=\"${sysenv.OTA_PASS}\"
