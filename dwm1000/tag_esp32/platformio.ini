[env:esp32_tag]
platform = espressif32 @ 6.10.0
board = esp32dev
framework = arduino
lib_extra_dirs = ../../libs
lib_deps = https://github.com/vortex314/arduino-dw1000.git#esp32-custom-pins
monitor_speed = 115200
upload_speed = 921600
build_unflags = -Werror=return-type
build_flags =
    -DCONFIG_DISABLE_HAL_LOCKS
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -DOTA_PASS=\"${sysenv.OTA_PASS}\"
