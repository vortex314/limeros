[env:esp32_tag]
platform = espressif32 @ 6.10.0
board = esp32dev
framework = arduino
lib_extra_dirs = ../../libs
monitor_speed = 115200
upload_speed = 921600
build_unflags = -Werror=return-type
build_flags =
    -DUWB_SERVER_IP=192,168,0,148
    -DUWB_MULTICAST_IP=239,0,0,23
    -DUWB_PORT=50000
    -DCONFIG_DISABLE_HAL_LOCKS
    -DDW1000_SPI_SCK=17
    -DDW1000_SPI_MISO=34
    -DDW1000_SPI_MOSI=23
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -DOTA_PASS=\"${sysenv.OTA_PASS}\"