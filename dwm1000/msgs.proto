syntax = "proto3";

package base;



message Envelope {
    uint32 src = 1;      // source: FNV-1a 32-bit hash of the device name
    uint32 dst = 2;      // destination (0 for events)
    uint32 msg_type = 3; // determines how payload is parsed
    bytes  payload = 4;  // sub-message encoded per msg_type
}

message Announce {
    string         device    = 1; // example "uwb_anchor_1"
    repeated uint32 msg_types = 2; // packed; msg_types this device emits
    bytes          ip_address = 3; // 4 bytes, IPv4 network order
    uint32         port       = 4; // UDP port the device listens on
}

message SetBroker {
    bytes  ip_address = 1; // 4 bytes, IPv4 network order
    uint32 port       = 2;
}

message Subscribe {
    uint32 src = 1;
    uint32 dst = 2;
    uint32 msg_type = 3;
}

message SysEvent {
    uint64 uptime_ms        = 1;
    bytes  wifi_mac_address = 2; // 6 bytes
    bytes  wifi_ip_address  = 3; // 4 bytes, IPv4 network order
    int32  wifi_rssi        = 4; // dBm (negative); was uint32, fixed to int32
}

message UwbAnchorEvent {
    bytes uwb_mac_address = 1; // 8-byte EUI-64
}

message UwbTagEvent {
    bytes  uwb_mac_address = 1; // 8-byte EUI-64 of the tag
    bytes  anchor          = 2; // 2-byte responder short address (big-endian)
    float  distance_m      = 3;
    float  rx_power_db     = 4;
}
