; One source tree for all anchors. Each env sets ANCHOR_ID, from which the
; sketch derives DEVICE_NAME (uwb_anchor_N), OTA hostname (uwb-anchorN) and
; UWB address (82:17:5B:D5:A9:9A:E2:<0x9B+N>).
; ANTENNA_DELAY is calibrated per anchor (unicast ranging, tag at 1.75 m, 9 min
; median, 2026-11-15; tag at 16456). +1 unit shortens that anchor's range ~4.7 mm.
;
;   pio run -e anchor3 -t upload      # build + flash one anchor
;   pio run                           # build all anchors

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_extra_dirs = ../../libs
monitor_speed = 115200
upload_speed = 921600
build_unflags = -Werror=return-type
build_flags =
    -DUWB_SERVER_IP=192,168,0,148
    -DUWB_MULTICAST_IP=239,0,0,23
    -DUWB_PORT=50000
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -DOTA_PASS=\"${sysenv.OTA_PASS}\"

[env:anchor1]
build_flags = ${env.build_flags} -DANCHOR_ID=1 -DANTENNA_DELAY=16488

[env:anchor2]
build_flags = ${env.build_flags} -DANCHOR_ID=2 -DANTENNA_DELAY=16454

[env:anchor3]
build_flags = ${env.build_flags} -DANCHOR_ID=3 -DANTENNA_DELAY=16475

[env:anchor4]
build_flags = ${env.build_flags} -DANCHOR_ID=4 -DANTENNA_DELAY=16465

[env:anchor5]
build_flags = ${env.build_flags} -DANCHOR_ID=5 -DANTENNA_DELAY=16531
