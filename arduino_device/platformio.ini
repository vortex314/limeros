[env:lplm4f120h5qr]
platform = titiva
board = lplm4f120h5qr
framework = arduino
monitor_port = /dev/ttyACM1
monitor_speed = 115200

extra_scripts = pre:patch.py

build_src_filter = +<*> -<sketch.cpp>
platform_packages =
    toolchain-gccarmnoneeabi@~1.90301.0

build_flags = 
;   -std=gnu++11
    -D_GNU_SOURCE
    -D_DEFAULT_SOURCE
    -DNOMINMAX
    -fno-exceptions
    -fno-rtti
    -lstdc++ -lm
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -std=gnu++14
build_src_flags = 
    -Wno-implicit-function-declaration
    -Wno-builtin-declaration-mismatch