[env:esp32_compass]
platform = espressif32
board = esp32dev
framework = arduino
lib_extra_dirs = ../libs
monitor_speed = 115200
upload_speed = 921600
build_unflags = -Werror=return-type
build_flags =
    -DCOMPASS_SERVER_IP=192,168,0,148
    -DCOMPASS_MULTICAST_IP=239,0,0,23
    -DCOMPASS_PORT=50000
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -DOTA_PASS=\"${sysenv.OTA_PASS}\"
