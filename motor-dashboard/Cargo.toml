[package]
name = "motor-dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
cbor2 = { version = "1.1", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
dashmap = "6.1"
eframe = { version = "0.31.1", features = ["accesskit", "glow"] }
kameo = "0.22.2"
lazy_static = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
tokio = { version = "1.49", features = ["full"] }