[package]
name = "broker_actix"
version = "0.1.0"
edition = "2024"

[dependencies]
actix = "0.13"
actix-rt = "2"
common = { path = "../../common" }
generated = { path = "../../generated" }
serialport = "4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cbor2 = { version = "*", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
socket2 = { version = "0.5", features = ["all"] }
dashmap = "6"
